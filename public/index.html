<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0f0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Is it hot yet?</title>
  <script>
    (function () {
      // Owner screens install as an app that opens on Control; everything else opens on Status.
      var friend = !/^\/(control|schedule|log|settings|login)/.test(location.pathname);
      document.write('<link rel="manifest" href="' + (friend ? '/manifest-friend.webmanifest' : '/manifest.webmanifest') + '">');
      document.write('<meta name="apple-mobile-web-app-title" content="Is it hot yet?">');
    })();
  </script>
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <button id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="menu">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div id="menu-backdrop" hidden></div>
  <nav id="menu" hidden aria-label="Menu"></nav>
  <main id="app" aria-live="polite"></main>
  <nav id="tabs" hidden>
    <a href="/control" data-tab="control">Control</a>
    <a href="/schedule" data-tab="schedule">Schedule</a>
    <a href="/log" data-tab="log">Log</a>
    <a href="/settings" data-tab="settings">Settings</a>
  </nav>
  <div id="stopbar" hidden><span id="stopbar-text"></span><button id="stopbar-btn" class="danger">Stop</button></div>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
